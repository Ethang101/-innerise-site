<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>InneRISE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,700;1,700&family=Source+Serif+4:wght@400;600&display=swap">
<style>
:root{--paper:#F5F8FA;--ink:#0F2A44;--soft:#4E5B6B;--rule:#DDE5EC;--accent:#1B8A8F;--card:#FFFFFF;
  --display:"Montserrat","Helvetica Neue",Arial,sans-serif;--body:"Source Serif 4",Georgia,serif}
@media (prefers-color-scheme: dark){:root{--paper:#0B1F33;--ink:#EEF1F5;--soft:#A9B4C2;--rule:#1E3A57;--accent:#4FD1C5;--card:#10283F;color-scheme:dark}}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;margin:0}
.wrap{max-width:680px;margin:0 auto;padding:64px 20px 72px}
.wm{font-family:var(--display);font-size:34px;letter-spacing:-.01em}
.wm .a{font-weight:300} .wm .b{font-weight:700;font-style:italic;color:var(--accent)}
.tag{color:var(--soft);margin:4px 0 32px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px 20px;margin-bottom:14px}
h2{font-family:var(--display);font-size:18px;margin:0 0 6px}
p{margin:0}
a{color:var(--accent)}
footer{margin-top:40px;color:var(--soft);font-size:14px;border-top:1px solid var(--rule);padding-top:16px}
</style></head><body>
<main class="wrap">
  <div class="wm"><span class="a">Inne</span><span class="b">RISE</span></div>
  <p class="tag">Use your phone on purpose.</p>
  <div class="card">
    <h2>Support</h2>
    <p>Questions, problems or feedback about InneRISE? Email <a href="mailto:support@innerise.app">support@innerise.app</a>.</p>
  </div>
  <div class="card">
    <h2>Privacy</h2>
    <p>Read the <a href="/privacy/">InneRISE Privacy Policy</a>.</p>
  </div>
  <footer>InneRISE is made by Shortbus Design Group, LLC.</footer>
</main>
</body></html>
