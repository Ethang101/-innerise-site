<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<!-- innerise.app/get: where InneRISE invitations send people to get the app. Today: the TestFlight
     public link. At launch, change ONLY the address below (all 4 places) to the App Store
     link; the invitations in the app never change. -->
<meta http-equiv="refresh" content="0; url=https://testflight.apple.com/join/ufhePNDe">
<link rel="canonical" href="https://testflight.apple.com/join/ufhePNDe">
<meta name="robots" content="noindex">
<title>Get InneRISE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,700;1,700&family=Source+Serif+4:wght@400;600&display=swap">
<style>
:root{--paper:#F5F8FA;--ink:#0F2A44;--soft:#4E5B6B;--accent:#1B8A8F;--on-accent:#FFFFFF;
  --display:"Montserrat","Helvetica Neue",Arial,sans-serif;--body:"Source Serif 4",Georgia,serif}
@media (prefers-color-scheme: dark){:root{--paper:#0B1F33;--ink:#EEF1F5;--soft:#A9B4C2;--accent:#4FD1C5;--on-accent:#0B1F33;color-scheme:dark}}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;margin:0}
.wrap{max-width:520px;margin:0 auto;padding:72px 20px;text-align:center}
.wm{font-family:var(--display);font-size:34px;letter-spacing:-.01em}
.wm .a{font-weight:300} .wm .b{font-weight:700;font-style:italic;color:var(--accent)}
p{color:var(--soft);margin:12px 0 28px}
.btn{display:inline-block;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:700;
  text-decoration:none;padding:14px 28px;border-radius:999px}
</style></head><body>
<main class="wrap">
  <div class="wm"><span class="a">Inne</span><span class="b">RISE</span></div>
  <p>Taking you to InneRISE…</p>
  <a class="btn" href="https://testflight.apple.com/join/ufhePNDe">Get InneRISE</a>
</main>
<script>location.replace("https://testflight.apple.com/join/ufhePNDe");</script>
</body></html>
