<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="The InneRISE prize counter: scan or type a winner's prize code, check it, then confirm it.">

  <script>
    // The counter's short address: the dashboard's Redeem prizes, keeping whatever came with it (?demo, ?org, a hand-over).
    (function () {
      var q = new URLSearchParams(location.search);
      q.set('section', 'redeem');
      location.replace('../dashboard/?' + q.toString().replace(/^demo=(&|$)/, 'demo$1') + location.hash);
    })();
  </script>

<body class="door">

    </section>
  </main>
